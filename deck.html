<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hope Studio">
<title>Hope Studio</title>
<style>
:root{--bg:#07090f;--card:#121829;--line:#232c47;--txt:#eef2ff;--dim:#8d97b5;--pink:#ff4fa3;--blue:#4fc3ff;--good:#3ddc97;--bad:#ff5d6c;--gold:#ffb547}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,system-ui,Segoe UI,sans-serif;overflow-x:hidden}
.wrap{max-width:720px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{margin:0;font-size:21px}h1 b{color:var(--pink)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--bad)}.dot.on{background:var(--good)}
.status{font-size:12px;color:var(--dim)}
.banner{background:#2a1520;border:1px solid var(--bad);border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px}
.banner ol{margin:6px 0 0 18px;padding:0}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.btn{border:0;border-radius:16px;padding:18px 10px;font:inherit;font-weight:800;font-size:16px;color:#fff;background:var(--card);border:1px solid var(--line);cursor:pointer;user-select:none;transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn.live{background:linear-gradient(135deg,#ff2d6f,#ff7a3d);border:0}.btn.rec{background:#3a1018;border-color:#ff5d6c}
.btn.on{box-shadow:0 0 0 3px #fff inset}
.clipit{grid-column:span 2;font-size:24px;padding:26px;background:linear-gradient(135deg,#4fc3ff,#7b5cff);border:0}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.scene{padding:16px 10px;font-size:15px}.scene.cur{background:var(--blue);color:#04121d;border-color:var(--blue)}
.mic{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:700;cursor:pointer}
.mic .st{font-size:13px;padding:4px 10px;border-radius:999px;background:#163a2a;color:var(--good)}.mic.muted .st{background:#4a1520;color:var(--bad)}
.clip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.clip .n{font-weight:700;font-size:14px;word-break:break-all}.clip .t{font-size:12px;color:var(--dim)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row a,.row button{flex:1;min-width:120px;text-align:center;text-decoration:none;font-size:13px;padding:10px;border-radius:10px;background:#1b2440;color:var(--txt);border:1px solid var(--line);font-weight:700;font-family:inherit}
.timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--pink)}
#toasts{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:9;width:min(92vw,520px)}
.toast{background:#1d2745;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600;animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.small{font-size:12px;color:var(--dim)}
button:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>🎛️ Hope <b>Studio</b></h1><div class="status"><span class="dot" id="dot"></span><span id="st">connecting…</span></div></header>
  <div id="banner"></div>
  <div class="big">
    <button class="btn live" id="bStream" onclick="act('stream')">GO LIVE</button>
    <button class="btn rec" id="bRec" onclick="act('record')">● REC</button>
    <button class="btn clipit" onclick="clipIt()">🎬 CLIP IT</button>
  </div>
  <div class="small" id="rb"></div>
  <button class="btn" style="width:100%;margin-top:10px;background:#10261c;border-color:#3ddc97" onclick="act('preflight');toast('🩺 Checking OBS…')">🩺 Preflight check (before GO LIVE)</button>
  <div id="pf"></div>
  <a href="#" id="meetlink" class="btn" style="display:block;text-align:center;text-decoration:none;margin-bottom:6px;background:#2a2108;border-color:#ffb547">🏁 Car Meet Scoreboard</a>
  <a href="#" id="pitlink" class="btn" style="display:block;text-align:center;text-decoration:none;margin-bottom:6px;background:#2a0f1e;border-color:#ff4fa3">🎟️ Pit Pass (chat requests)</a>
  <h2>Scenes</h2><div class="grid" id="scenes"></div>
  <h2>Mics + sound</h2><div class="grid" id="mics"></div>
  <h2>Clips <span class="small">(newest first)</span></h2><div id="clips"></div>
  <p class="small">Vertical = 1080×1920 for TikTok/Reels/Shorts, made on your RTX. "Blur" keeps the whole picture; "Crop" fills the screen from the center.</p>
</div>
<div id="toasts"></div>
<script>
const T=new URLSearchParams(location.search).get('t');let S=null,ws=null,shown=new Set();
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function connect(){ws=new WebSocket(`ws://${location.host}/?t=${encodeURIComponent(T)}`);
 ws.onopen=()=>{$('st').textContent='PC connected'};
 ws.onmessage=e=>{S=JSON.parse(e.data);draw()};
 ws.onclose=()=>{$('dot').className='dot';$('st').textContent='PC offline… retrying';setTimeout(connect,2000)}}
function act(a,extra={}){if(navigator.vibrate)navigator.vibrate(30);ws&&ws.readyState===1&&ws.send(JSON.stringify({a,...extra}))}
function clipIt(){act('clipit');toast('🎬 Saving the last moments…')}
function fmt(ms){const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;$('toasts').appendChild(d);setTimeout(()=>d.remove(),3500)}
function drawPF(){const p=S.preflight;const el=$("pf");if(!el)return;if(!p){el.innerHTML="";return}
 el.innerHTML=`<div style="margin-top:10px;border:1px solid ${p.pass?"#3ddc97":"#ffb547"};border-radius:14px;padding:12px;background:var(--card)"><b>${p.pass?"✅ Ready to go live":"⚠️ Fix these first"}</b> <span class="small">${new Date(p.at).toLocaleTimeString()}</span>${p.items.map(i=>`<div style="display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--line)"><span>${i.ok?"✅":"⚠️"}</span><span><b>${esc(i.label)}</b><br><span class="small">${esc(i.detail)}</span></span></div>`).join("")}</div>`}
function draw(){drawPF();
 $('dot').className='dot'+(S.obsReady?' on':'');$('st').textContent=S.obsReady?'OBS connected':'OBS not connected';
 $('banner').innerHTML=S.obsReady?'':`<div class="banner"><b>OBS isn't connected.</b> ${esc(S.lastErr)}<ol><li>Open OBS on the PC.</li><li>Tools → WebSocket Server Settings → tick <b>Enable WebSocket server</b> → OK.</li><li>This page connects by itself in a few seconds.</li></ol></div>`;
 $('bStream').innerHTML=S.streaming?`■ END LIVE<br><span class="timer" id="lt"></span>`:'GO LIVE';$('bStream').classList.toggle('on',S.streaming);
 $('bRec').textContent=S.recording?'■ STOP REC':'● REC';$('bRec').classList.toggle('on',S.recording);
 $('rb').innerHTML=S.obsReady?(S.replay?'🟢 Replay buffer ON: CLIP IT saves the last moments.':`⚪ Replay buffer OFF. CLIP IT turns it on first. <a href="#" onclick="act('replay');return false" style="color:var(--blue)">Turn on</a>`):'';
 $('scenes').innerHTML=S.scenes.map(n=>`<button class="btn scene ${n===S.current?'cur':''}" onclick='act("scene",{v:${JSON.stringify(n)}})'>${esc(n)}</button>`).join('')||'<span class="small">No scenes yet.</span>';
 $('mics').innerHTML=S.mics.map(m=>`<div class="mic ${m.muted?'muted':''}" onclick='act("mute",{v:${JSON.stringify(m.name)}})'><span>${esc(m.name)}</span><span class="st">${m.muted?'MUTED':'ON'}</span></div>`).join('')||'<span class="small">No audio sources found.</span>';
 $('clips').innerHTML=S.clips.map(c=>`<div class="clip"><div class="n">${esc(c.name)}</div><div class="t">${new Date(c.at).toLocaleString()}${c.busy?' · ⏳ making vertical…':''}${c.err?' · ⚠️ '+esc(c.err):''}</div>
  <div class="row"><a href="/clip?t=${encodeURIComponent(T)}&id=${c.id}" target="_blank">▶ Original</a>
  ${c.vertical?`<a href="/clip?t=${encodeURIComponent(T)}&id=${c.id}&v=1" target="_blank">📱 Vertical (save)</a>`:`<button onclick="act('vertical',{id:'${c.id}',mode:'blur'})" ${c.busy?'disabled':''}>📱 Vertical · Blur</button><button onclick="act('vertical',{id:'${c.id}',mode:'crop'})" ${c.busy?'disabled':''}>📱 Vertical · Crop</button>`}</div></div>`).join('')||'<span class="small">No clips yet. Hit CLIP IT during a stream.</span>';
 for(const t of S.toasts||[]){const k=t.at+t.t;if(!shown.has(k)&&Date.now()-t.at<8000+Math.abs(Date.now()-S.now)){shown.add(k);toast(t.t)}}
 S._clock=Date.now()-S.now;
}
setInterval(()=>{if(S&&S.streaming&&S.streamStart&&$('lt'))$('lt').textContent=fmt(Date.now()-S._clock-S.streamStart)},500);
document.getElementById("pitlink").href="/pit?t="+encodeURIComponent(T);
document.getElementById("meetlink").href="/meet?t="+encodeURIComponent(T);
connect();
</script>
</body>
</html>
